[workspace]
resolver = "3"
members = [
    "domain",
    "solver",
    "application",
    "proto",
    "adapters/*",
    "simulation",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Crates internos
sched-domain = { path = "domain" }
sched-solver = { path = "solver" }
sched-application = { path = "application" }
sched-proto = { path = "proto" }
sched-adapter-in-memory = { path = "adapters/in_memory" }
sched-adapter-gateway-http = { path = "adapters/gateway_http" }
sched-adapter-grpc-events = { path = "adapters/grpc_events" }
sched-adapter-grpc-catalog = { path = "adapters/grpc_catalog" }
sched-adapter-nats-bus = { path = "adapters/nats_bus" }

# Externos
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
async-nats = "0.50"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
protox = "0.9"
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
