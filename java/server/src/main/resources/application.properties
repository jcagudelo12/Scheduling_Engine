# Mismas variables SCHED_* que la versión en Rust. Diferencia: los puertos se configuran
# con SCHED_HTTP_PORT y SCHED_GRPC_PORT en lugar de SCHED_HTTP_ADDR y SCHED_GRPC_ADDR.
sched.role=${SCHED_ROLE:all}
sched.nats.url=${SCHED_NATS_URL:nats://localhost:4222}
sched.nats.subject-prefix=${SCHED_NATS_SUBJECT_PREFIX:sched}
sched.nats.stream=${SCHED_NATS_STREAM:SCHED_CATALOG}
sched.grpc.port=${SCHED_GRPC_PORT:50051}
sched.max-combinations=${SCHED_MAX_COMBINATIONS:200}

server.port=${SCHED_HTTP_PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off

# Hilos virtuales (Java 21+): cada solicitud HTTP corre en un hilo liviano.
spring.threads.virtual.enabled=true

# JSON en snake_case, igual que la versión en Rust.
spring.jackson.property-naming-strategy=SNAKE_CASE
